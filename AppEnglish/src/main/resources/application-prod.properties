# Profile: prod — chạy trên EC2: SPRING_PROFILES_ACTIVE=prod
# DB, JWT, AWS, Kafka, keys… vẫn lấy từ biến môi trường (giống application.properties).

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Kafka: bật consumer (prod thường có broker). Nếu EC2 chưa có Kafka, set:
# SPRING_KAFKA_LISTENER_AUTO_STARTUP=false
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}

# Broker — bắt buộc set trên server có Kafka, ví dụ:
# SPRING_KAFKA_BOOTSTRAP_SERVERS=your-kafka:9092
# (Không set biến thành chuỗi rỗng; nếu không dùng Kafka, tắt listener như trên và giữ default localhost nếu cần.)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging.level.root=INFO
logging.level.com.example.appenglish.modules.speaking.handler.OpenAiRealtimeHandler=INFO
