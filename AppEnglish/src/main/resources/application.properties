# === Local mặc định (không cần profile) ===
# EC2/production: chạy với SPRING_PROFILES_ACTIVE=prod (xem application-prod.properties).
#
# Kafka: mặc định BẬT listener/producer. Bootstrap từ máy host với docker-compose.yml của repo: localhost:9092
# (PLAINTEXT_HOST trong broker advertise localhost:9092; cổng 29092 chỉ dùng nội bộ PLAINTEXT://kafka:29092).
# Spring chạy trong container cùng compose: SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
# Nếu tạm không có broker: SPRING_KAFKA_LISTENER_AUTO_STARTUP=false
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}

# spring-boot-docker-compose: bật mặc định (dependency optional) — có thể start/read docker-compose.yml.
# Service connections có thể inject kafka:29092 và jdbc ...db:5432... — trên máy host DNS không có kafka/db.
# DockerHostServiceConnectionRewriteListener ghi đè thành localhost khi JVM không chạy trong container.
# Tắt hẳn compose: spring.docker.compose.enabled=false

# eSpeak NG Configuration (dùng để tạo IPA cho transcript)
# macOS/Linux: cài "brew install espeak-ng" rồi dùng "espeak-ng" (từ PATH)
# Windows portable: đặt ipa.espeak.command=tools/eSpeak NG/espeak-ng.exe hoặc set env IPA_ESPEAK_COMMAND
ipa.espeak.command=${IPA_ESPEAK_COMMAND:espeak-ng}
ipa.espeak.voice=en-us
spring.application.name=AppEnglish
server.servlet.context-path=/api

# CORS — FE (Vite :5173). Env APP_CORS_ORIGINS có thể override; nếu env để rỗng, SecurityConfig vẫn fallback dev.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Multipart upload limits (cho phép upload video lên tới 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Database Configuration
# Chạy Spring trên máy (IDE/mvn) + Postgres trong Docker (map 5432): dùng localhost — KHÔNG dùng host "db"
# (db là tên service trong docker-compose, chỉ resolve trong network container).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learning_english}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Realtime WS debug
logging.level.com.example.appenglish.modules.speaking.handler.OpenAiRealtimeHandler=DEBUG

# OpenAI Realtime: VAD / transcription (giảm kích hoạt nhầm khi môi trường hơi ồn — chỉnh thêm qua env nếu cần)
openai.realtime.vad.threshold=${OPENAI_REALTIME_VAD_THRESHOLD:0.58}
openai.realtime.vad.silence-duration-ms=${OPENAI_REALTIME_VAD_SILENCE_MS:950}
openai.realtime.vad.prefix-padding-ms=${OPENAI_REALTIME_VAD_PREFIX_MS:400}
openai.realtime.transcription.model=${OPENAI_REALTIME_TRANSCRIPTION_MODEL:whisper-1}


# Có thể override bằng file AppEnglish/config/application.properties (ưu tiên cao, không commit — xem .gitignore)
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:learning-english-bucket}
# ===============================
# Kafka configuration
# ===============================
# Cảnh báo: export SPRING_KAFKA_BOOTSTRAP_SERVERS="" → lỗi *No resolvable bootstrap urls*.
# Cách xử lý: unset biến hoặc đặt localhost:9092 (host) / kafka:29092 (app trong Docker cùng compose).
# Chưa có broker: SPRING_KAFKA_LISTENER_AUTO_STARTUP=false để app vẫn khởi động.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Consumer
spring.kafka.consumer.group-id=user-learning-progress-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Listener
spring.kafka.listener.ack-mode=record

# Custom Kafka topics
spring.kafka.topics.youtube-transcribe=youtube-transcribe
spring.kafka.topics.upload-transcribe=upload-transcribe
spring.kafka.topics.pronunciation-upload=pronunciation-upload
spring.kafka.topics.pronunciation-finalize=pronunciation-finalize-v2

# Azure Speech (set via env in production)
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:southeastasia}
azure.speech.locale=${AZURE_SPEECH_LOCALE:en-US}
azure.speech.timeout-seconds=${AZURE_SPEECH_TIMEOUT_SECONDS:20}

# OpenAI (set via env)
openai.api.key=${OPENAI_API_KEY:}
openai.realtime.model=${OPENAI_REALTIME_MODEL:gpt-4o-realtime-preview}
openai.realtime.voice=${OPENAI_REALTIME_VOICE:alloy}

# AI Chat (chatbot). Leave app.ai.chat.url empty to use OpenAI; set to your API URL to use your own.
app.ai.chat.url=${APP_AI_CHAT_URL:}
app.ai.chat.api-key=${APP_AI_CHAT_API_KEY:}
app.ai.chat.model=${APP_AI_CHAT_MODEL:gpt-4o-mini}

# ffmpeg (must be available in PATH or set full path)
# On macOS/Linux use "ffmpeg" (from PATH). On Windows set FFMPEG_PATH to full path if needed.
app.ffmpeg.path=${FFMPEG_PATH:ffmpeg}
# Thời gian chờ ffmpeg xử lý xong sau khi ghi hết audio vào stdin (giây). Tăng nếu ghi âm dài bị timeout.
app.pronunciation.ffmpeg.wait-timeout-seconds=45

# Server Configuration
# Swagger/OpenAPI
# Swagger/OpenAPI
# ===============================
# YouTube API configuration
# ===============================
youtube.api.key=${YOUTUBE_API_KEY:}
youtube.api.baseUrl=${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}

# ===============================
# Temp storage (local filesystem)
# ===============================
# For flexible deploy: can override via env APP_TEMP_DIR.
# Default: ./temp (relative to working directory)
app.temp-dir=${APP_TEMP_DIR:temp}

