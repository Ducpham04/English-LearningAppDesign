spring.application.name=AppEnglish

# Database Configuration
# Kết nối tới port 5433 (được map từ 5432 trong docker-compose) và database 'learning_english'
spring.datasource.url=jdbc:postgresql://localhost:5433/learning_english
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.main.allow-bean-definition-overriding=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT Configuration
app.jwt.secret=mySecretKey123456789012345678901234567hello89012345678901234567890
app.jwt.expiration=86400000

# AWS Configuration
aws.accessKey=AKIAUKHLJE4U3PXCBN4U
aws.secretKey=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
aws.region=ap-southeast-1
aws.s3.bucket=learning-english-bucket

# YouTube API configuration
YOUTUBE_API_KEY=AIzaSyDwplMnjtUszTYXO-59nH84GhjtqszzM8U
youtube.api.key=${YOUTUBE_API_KEY}
youtube.api.baseUrl=https://www.googleapis.com/youtube/v3

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true


spring.kafka.consumer.group-id=user-learning-progress-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.listener.ack-mode=record

# Custom Kafka topics
spring.kafka.topics.youtube-transcribe=youtube-transcribe
spring.kafka.topics.upload-transcribe=upload-transcribe

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Temp storage
app.temp-dir=${APP_TEMP_DIR:temp}
